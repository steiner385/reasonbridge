<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>ReasonBridge - Rational Discussion Platform</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="ReasonBridge is a platform for constructive discourse through AI-powered analysis, structured argumentation, and evidence-based discussions. Build bridges through rational discussion." />
    <meta name="keywords" content="rational discussion, debate, critical thinking, AI analysis, common ground, argumentation, constructive discourse" />
    <meta name="author" content="ReasonBridge" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://reasonbridge.org" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reasonbridge.org" />
    <meta property="og:title" content="ReasonBridge - Rational Discussion Platform" />
    <meta property="og:description" content="Build bridges through rational discussion. AI-powered analysis for constructive discourse and common ground discovery." />
    <meta property="og:image" content="https://reasonbridge.org/assets/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ReasonBridge" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://reasonbridge.org" />
    <meta name="twitter:title" content="ReasonBridge - Rational Discussion Platform" />
    <meta name="twitter:description" content="Build bridges through rational discussion. AI-powered analysis for constructive discourse." />
    <meta name="twitter:image" content="https://reasonbridge.org/assets/brand/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#312e81" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/brand/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png" />

    <!-- Google Fonts - ReasonBridge Brand Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ReasonBridge",
        "description": "A platform for constructive discourse through AI-powered analysis, structured argumentation, and evidence-based discussions.",
        "url": "https://reasonbridge.org",
        "applicationCategory": "Social",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Organization",
          "name": "ReasonBridge",
          "url": "https://reasonbridge.org"
        }
      }
    </script>

    <!-- Dark mode preload script - prevents flash of wrong theme -->
    <script>
      (function() {
        try {
          const themePreference = localStorage.getItem('theme-preference');
          const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

          // Apply dark class if:
          // - User explicitly selected 'dark' mode, OR
          // - User selected 'auto' mode AND system prefers dark, OR
          // - No preference stored AND system prefers dark (default to auto)
          if (
            themePreference === 'dark' ||
            (themePreference === 'auto' && systemPrefersDark) ||
            (!themePreference && systemPrefersDark)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // Fail silently if localStorage is not available
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
