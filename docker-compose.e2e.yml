# E2E Testing Environment
# Complete stack with infrastructure, all backend services, and frontend
# Mimics production deployment for realistic end-to-end testing
#
# MEMORY CONSTRAINTS (Jenkins runner-3 has 6GB):
# - Services total: ~2.0GB during startup (with db-migrate/seed running)
# - Playwright container: 2GB (configured in jenkins-lib)
# - Peak usage: ~4.0GB - keep limits tight to avoid OOM (exit code 137)
# - Resource lock in jenkins-lib prevents concurrent E2E runs
#
# Note: Explicit image names are set for all built services to enable Docker
# layer caching across builds with different COMPOSE_PROJECT_NAME values.
# Without explicit image names, each unique project name would rebuild all images.

# Shared JWT secret for the E2E stack. Defined once as a YAML anchor and
# referenced by every service instead of copy-pasting the literal six times.
# Interpolated from the environment so CI/local runs can override it, while the
# default keeps the throwaway E2E value working with no .env file. Production
# services must source JWT secrets from AWS Secrets Manager (see docs/SECRETS.md).
x-jwt-secret: &jwt-secret ${JWT_SECRET:-mock-jwt-secret-for-e2e-testing}

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  postgres:
    image: postgres:15-alpine
    # Note: container_name removed to allow parallel builds with different COMPOSE_PROJECT_NAME
    environment:
      POSTGRES_USER: reasonbridge_test
      POSTGRES_PASSWORD: reasonbridge_test
      POSTGRES_DB: reasonbridge_test
      # Reduce shared_buffers to work within memory limits (default 128MB is too high)
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    # Host port removed to prevent CI conflicts - services communicate via Docker network
    # For local debugging, uncomment: ports: ['5434:5432']
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=50
      -c work_mem=2MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reasonbridge_test -d reasonbridge_test']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 256m
    networks:
      - reasonbridge-e2e

  redis:
    image: redis:7-alpine
    # Host port removed to prevent CI conflicts - services communicate via Docker network
    # For local debugging, uncomment: ports: ['6381:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  localstack:
    image: localstack/localstack:3.0
    environment:
      SERVICES: s3,sqs,sns,ses
      DEBUG: 0
      # Disable telemetry to prevent DNS failures in CI environments
      DISABLE_EVENTS: 1
      DATA_DIR: ''
    volumes:
      # Verify SES sender identity on startup (required for sending emails)
      - ./scripts/localstack-init/ready.d:/etc/localstack/init/ready.d:ro
    # Host port removed to prevent CI conflicts - services communicate via Docker network
    # For local debugging, uncomment: ports: ['4568:4566']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    networks:
      - reasonbridge-e2e

  # ============================================================================
  # Database Migration
  # ============================================================================

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/db-migrate:latest
    command: ['sh', '-c', 'cd packages/db-models && npx prisma migrate deploy']
    environment:
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    networks:
      - reasonbridge-e2e
    restart: 'no'

  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/db-seed:latest
    command: ['sh', '-c', 'cd packages/db-models && npx tsx prisma/seed.ts --demo']
    environment:
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    mem_limit: 384m
    networks:
      - reasonbridge-e2e
    restart: 'no'

  # ============================================================================
  # Backend Microservices
  # ============================================================================

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/api-gateway:latest
    command: ['node', 'services/api-gateway/dist/main.js']
    environment:
      PORT: 3000
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: *jwt-secret
      USER_SERVICE_URL: http://user-service:3001
      # Increase timeouts for E2E tests - services may be slower during cold start
      USER_SERVICE_TIMEOUT: 15000
      DISCUSSION_SERVICE_TIMEOUT: 15000
      DISCUSSION_SERVICE_URL: http://discussion-service:3007
      AI_SERVICE_URL: http://ai-service:3002
      MODERATION_SERVICE_URL: http://moderation-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3004
      FACT_CHECK_SERVICE_URL: http://fact-check-service:3006
      ACTIVITY_SERVICE_URL: http://activity-service:3008
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
      user-service:
        condition: service_healthy
      discussion-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/user-service:latest
    command: ['node', 'services/user-service/dist/main.js']
    environment:
      PORT: 3001
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Use database authentication for demo environment (supports bcrypt password hashes)
      AUTH_MODE: 'database'
      JWT_SECRET: *jwt-secret
      # Fixed verification code for E2E testing (enables full signup flow testing)
      E2E_VERIFICATION_CODE: '123456'
      # Cognito configuration (fallback, not used when AUTH_MOCK=true)
      COGNITO_USER_POOL_ID: us-east-1_test123
      COGNITO_CLIENT_ID: test_client_id
      COGNITO_REGION: us-east-1
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 5s
      timeout: 5s
      retries: 10
      # Increased start_period to allow full service initialization before health checks
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/ai-service:latest
    command: ['node', 'services/ai-service/dist/main.js']
    environment:
      PORT: 3002
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # AWS Bedrock configuration for AI features
      AWS_REGION: us-east-1
      AWS_PROFILE: default
      # Use cross-region inference profile for on-demand access
      BEDROCK_MODEL_ID: us.anthropic.claude-3-5-sonnet-20241022-v2:0
      JWT_SECRET: *jwt-secret
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      # Mount AWS credentials from host for Bedrock access
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  discussion-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/discussion-service:latest
    command: ['node', 'services/discussion-service/dist/main.js']
    environment:
      PORT: 3007 # Changed from 3002 to avoid conflict with ai-service
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
      ACTIVITY_SERVICE_URL: http://activity-service:3008
      JWT_SECRET: *jwt-secret
    ports:
      - '3007:3007'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3007/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  moderation-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/moderation-service:latest
    command: ['node', 'services/moderation-service/dist/main.js']
    environment:
      PORT: 3003
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:3002
      JWT_SECRET: *jwt-secret
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  recommendation-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/recommendation-service:latest
    command: ['node', 'services/recommendation-service/dist/main.js']
    environment:
      PORT: 3004
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
    ports:
      - '3004:3004'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/notification-service:latest
    command: ['node', 'services/notification-service/dist/main.js']
    environment:
      PORT: 3005
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: *jwt-secret
    ports:
      - '3005:3005'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3005/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  fact-check-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/fact-check-service:latest
    command: ['node', 'services/fact-check-service/dist/main.js']
    environment:
      PORT: 3006
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:3002
    ports:
      - '3006:3006'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  activity-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: reasonbridge-e2e/activity-service:latest
    command: ['node', 'services/activity-service/dist/main.js']
    environment:
      PORT: 3008
      NODE_ENV: test
      DATABASE_URL: postgresql://reasonbridge_test:reasonbridge_test@postgres:5432/reasonbridge_test
      REDIS_URL: redis://redis:6379
    ports:
      - '3008:3008'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    mem_limit: 128m
    networks:
      - reasonbridge-e2e

  # ============================================================================
  # Frontend
  # ============================================================================

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_API_GATEWAY_URL: /api
        VITE_API_URL: /api
        VITE_NOTIFICATION_SERVICE_URL: ''
    image: reasonbridge-e2e/frontend:latest
    ports:
      - '9080:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - reasonbridge-e2e

networks:
  reasonbridge-e2e:
    driver: bridge
